<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="CLASS" height="420px" preserveAspectRatio="none" style="width:685px;height:420px;background:#FFFFFF;" version="1.1" viewBox="0 0 685 420" width="685.6px" zoomAndPan="magnify"><title>System Architecture</title><defs/><g><g class="title" data-source-line="17"><text fill="#000000" font-family="sans-serif" font-size="16" font-weight="bold" lengthAdjust="spacing" textLength="155.6172" x="259.5223" y="26.4859">System Architecture</text></g><!--entity ClientNode--><g class="entity" data-qualified-name="ClientNode" data-source-line="20" id="ent0002"><polygon fill="#F1F1F1" points="330.4,54.0016,338.4,46.0016,422.6094,46.0016,422.6094,80.5227,414.6094,88.5227,330.4,88.5227,330.4,54.0016" style="stroke:#181818;stroke-width:0.4;"/><line style="stroke:#181818;stroke-width:0.4;" x1="414.6094" x2="422.6094" y1="54.0016" y2="46.0016"/><line style="stroke:#181818;stroke-width:0.4;" x1="330.4" x2="414.6094" y1="54.0016" y2="54.0016"/><line style="stroke:#181818;stroke-width:0.4;" x1="414.6094" x2="414.6094" y1="54.0016" y2="88.5227"/><text fill="#000000" font-family="sans-serif" font-size="11.2" lengthAdjust="spacing" textLength="55.4094" x="344.8" y="75.6617">ClientNode</text></g><!--entity ApplicationNode--><g class="entity" data-qualified-name="ApplicationNode" data-source-line="23" id="ent0003"><polygon fill="#F1F1F1" points="317.2,213.6016,325.2,205.6016,435.5664,205.6016,435.5664,240.1227,427.5664,248.1227,317.2,248.1227,317.2,213.6016" style="stroke:#181818;stroke-width:0.4;"/><line style="stroke:#181818;stroke-width:0.4;" x1="427.5664" x2="435.5664" y1="213.6016" y2="205.6016"/><line style="stroke:#181818;stroke-width:0.4;" x1="317.2" x2="427.5664" y1="213.6016" y2="213.6016"/><line style="stroke:#181818;stroke-width:0.4;" x1="427.5664" x2="427.5664" y1="213.6016" y2="248.1227"/><text fill="#000000" font-family="sans-serif" font-size="11.2" lengthAdjust="spacing" textLength="81.5664" x="331.6" y="235.2617">ApplicationNode</text></g><g class="entity" data-qualified-name="GMN4" data-source-line="26" id="ent0005"><path d="M4.8,194.8016 L4.8,258.5656 A0,0 0 0 0 4.8,258.5656 L248.9539,258.5656 A0,0 0 0 0 248.9539,258.5656 L248.9539,230.0016 L317.144,226.8016 L248.9539,223.6016 L248.9539,202.8016 L240.9539,194.8016 L4.8,194.8016 A0,0 0 0 0 4.8,194.8016" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.4;"/><path d="M240.9539,194.8016 L240.9539,202.8016 L248.9539,202.8016 L240.9539,194.8016" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.4;"/><text fill="#000000" font-family="sans-serif" font-size="10.4" lengthAdjust="spacing" textLength="222.5539" x="12" y="211.6574">Composed by the bussiness logic of the system,</text><text fill="#000000" font-family="sans-serif" font-size="10.4" lengthAdjust="spacing" textLength="200.0121" x="12" y="224.3984">it is responsible for processing the requests</text><text fill="#000000" font-family="sans-serif" font-size="10.4" lengthAdjust="spacing" textLength="180.3598" x="12" y="237.1395">from the clients and interacting with the</text><text fill="#000000" font-family="sans-serif" font-size="10.4" lengthAdjust="spacing" textLength="195.3758" x="12" y="249.8805">infrastructure layer to fulfill those requests.</text></g><!--entity LogsNode--><g class="entity" data-qualified-name="LogsNode" data-source-line="33" id="ent0007"><polygon fill="#F1F1F1" points="584.4,213.6016,592.4,205.6016,672.2617,205.6016,672.2617,240.1227,664.2617,248.1227,584.4,248.1227,584.4,213.6016" style="stroke:#181818;stroke-width:0.4;"/><line style="stroke:#181818;stroke-width:0.4;" x1="664.2617" x2="672.2617" y1="213.6016" y2="205.6016"/><line style="stroke:#181818;stroke-width:0.4;" x1="584.4" x2="664.2617" y1="213.6016" y2="213.6016"/><line style="stroke:#181818;stroke-width:0.4;" x1="664.2617" x2="664.2617" y1="213.6016" y2="248.1227"/><text fill="#000000" font-family="sans-seri